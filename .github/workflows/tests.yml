name: CloudSentinel Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Tests and Terraform Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run remediation tests
        run: python -m unittest discover -s tests -v

      - name: Scan insecure Terraform example
        run: |
          checkov -d terraform/insecure \
            --framework terraform \
            --soft-fail

      - name: Scan secure Terraform example
        run: |
          checkov -d terraform/secure \
            --framework terraform \
            --soft-fail
